<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Loan Underwriting Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="wordmark" aria-label="JBM">
      <span class="wordmark-bar" aria-hidden="true"></span>
      JBM
    </header>

    <section class="hero">
      <h1>AI Loan Underwriting Assistant</h1>
      <p>Enter applicant details to receive a risk assessment with explanations.</p>
    </section>

    <form id="appForm">
      <section class="card">
        <div class="form-grid two">
          <div class="field-group">
            <label class="field-label" for="limit_bal">Credit Limit</label>
            <input type="number" id="limit_bal" name="limit_bal" value="200000" min="0" required>
          </div>
          <div class="field-group">
            <label class="field-label" for="age">Age</label>
            <input type="number" id="age" name="age" value="35" min="18" max="120" required>
          </div>
        </div>

        <div class="form-grid">
          <div class="field-group">
            <label class="field-label" for="pay_0">PAY_0 (last month)</label>
            <select id="pay_0" name="pay_0">
              <option value="-1">Paid in full</option>
              <option value="0">Revolving (min payment)</option>
              <option value="1">1 mo delay</option>
              <option value="2">2 mo delay</option>
              <option value="3">3+ mo delay</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="pay_2">PAY_2 (2 months ago)</label>
            <select id="pay_2" name="pay_2">
              <option value="-1">Paid in full</option>
              <option value="0">Revolving (min payment)</option>
              <option value="1">1 mo delay</option>
              <option value="2">2 mo delay</option>
              <option value="3">3+ mo delay</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="pay_3">PAY_3 (3 months ago)</label>
            <select id="pay_3" name="pay_3">
              <option value="-1">Paid in full</option>
              <option value="0">Revolving (min payment)</option>
              <option value="1">1 mo delay</option>
              <option value="2">2 mo delay</option>
              <option value="3">3+ mo delay</option>
            </select>
          </div>
        </div>

        <div class="form-grid two">
          <div class="field-group">
            <label class="field-label" for="pay_amt1">Last Payment Amount</label>
            <input type="number" id="pay_amt1" name="pay_amt1" value="5000" min="0" required>
          </div>
          <div class="field-group">
            <label class="field-label" for="bill_amt1">Last Bill Amount</label>
            <input type="number" id="bill_amt1" name="bill_amt1" value="30000" min="0" required>
          </div>
        </div>
      </section>

      <button type="submit" class="btn btn-primary btn-block">Assess Risk</button>
    </form>

    <div id="result" class="result" hidden>
      <div class="card">
        <h3>Risk Assessment</h3>

        <div class="verdict">
          <span class="label">Risk</span>
          <span id="riskLabel" class="value"></span>
        </div>

        <div class="verdict">
          <span class="label">Default Probability</span>
          <span id="probability" class="value"></span>
        </div>

        <details>
          <summary>Feature Contributions (SHAP)</summary>
          <table>
            <thead>
              <tr><th>Feature</th><th>Value</th><th>SHAP</th><th>Impact</th></tr>
            </thead>
            <tbody id="shapTable"></tbody>
          </table>
        </details>

        <details open>
          <summary>Risk Report</summary>
          <div id="report"></div>
        </details>
      </div>
    </div>

    <div id="error" class="notice" hidden></div>

    <footer class="site-footer">
      Dataset:
      <a href="https://archive.ics.uci.edu/ml/datasets/default+of+credit+card+clients" target="_blank" rel="noopener">
        UCI Credit Card Default
        <svg class="arrow-icon" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3.5 8.5L8.5 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 3.5H8.5V7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      (2005, Taiwan)
    </footer>
  </div>

  <script>
    const limitInput = document.getElementById("limit_bal");
    const billInput = document.getElementById("bill_amt1");
    const payInput = document.getElementById("pay_amt1");

    function updateBillMax() {
      billInput.max = limitInput.value;
      if (parseFloat(billInput.value) > parseFloat(limitInput.value)) {
        billInput.value = limitInput.value;
      }
      updatePayMax();
    }

    function updatePayMax() {
      payInput.max = billInput.value;
      if (parseFloat(payInput.value) > parseFloat(billInput.value)) {
        payInput.value = billInput.value;
      }
    }

    limitInput.addEventListener("input", updateBillMax);
    billInput.addEventListener("input", updatePayMax);
    updateBillMax();

    document.getElementById("appForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const resultDiv = document.getElementById("result");
      const errorDiv = document.getElementById("error");
      resultDiv.hidden = true;
      errorDiv.hidden = true;

      const form = new FormData(e.target);
      const body = {
        limit_bal: parseFloat(form.get("limit_bal")),
        age: parseInt(form.get("age")),
        pay_0: parseInt(form.get("pay_0")),
        pay_2: parseInt(form.get("pay_2")),
        pay_3: parseInt(form.get("pay_3")),
        pay_amt1: parseFloat(form.get("pay_amt1")),
        bill_amt1: parseFloat(form.get("bill_amt1")),
      };

      try {
        const res = await fetch("/api/v1/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Request failed");
        }

        const data = await res.json();

        const riskLabel = document.getElementById("riskLabel");
        riskLabel.textContent = data.risk;
        riskLabel.className = "value " + (data.risk === "Low" ? "risk-low" : "risk-high");

        document.getElementById("probability").textContent =
          (data.default_probability * 100).toFixed(1) + "%";

        const shapBody = document.getElementById("shapTable");
        shapBody.innerHTML = "";
        for (const e of data.shap_explanations) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${e.feature_name}</td>
            <td>${e.feature_value}</td>
            <td class="${e.shap_value >= 0 ? "positive" : "negative"}">${e.shap_value >= 0 ? "+" : ""}${e.shap_value.toFixed(4)}</td>
            <td>${e.impact.replace("_", " ")}</td>
          `;
          shapBody.appendChild(row);
        }

        document.getElementById("report").innerHTML =
          marked.parse(data.risk_report || "*(Report generation unavailable)*");

        resultDiv.hidden = false;
      } catch (err) {
        errorDiv.textContent = "Error: " + err.message;
        errorDiv.hidden = false;
      }
    });
  </script>
</body>
</html>
